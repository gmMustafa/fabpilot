name: python-ci

# Lint + type-check + test every Python package in the uv workspace (api, simulator, ...).
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "simulator/**"
      - "data/**" # plant.yaml is validated by tests
      - "pyproject.toml" # workspace root: shared tool config + dev deps
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python-ci.yml"
  pull_request:
    # Same list as above. (Kept literal rather than a YAML alias to avoid relying on
    # anchor support in the Actions parser.)
    paths:
      - "api/**"
      - "simulator/**"
      - "data/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch: # manual "Run workflow" button

# Least privilege: the GITHUB_TOKEN can only read the repo, not push or create releases.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the run still in progress for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA (tags are mutable — same reasoning as the DB image digest).
# The comment says which release the SHA is; bump both together.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.6" # match local uv
      # --locked: fail if uv.lock is out of date (never silently re-resolve).
      # --all-packages: install every workspace member, not just the (virtual) root.
      - run: uv sync --locked --all-packages
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy api/app api/tests api/migrations simulator/src simulator/tests evals
      # The secret checks again: a local hook can be skipped (--no-verify) or not installed.
      - run: uv run pre-commit run no-openrouter-key --all-files
      - run: uv run pre-commit run no-env-file --all-files

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same image + digest as docker-compose.yml, so CI tests against what we run locally.
      # Service containers start before checkout: schema comes from Alembic migrations (1.1).
      db:
        image: timescale/timescaledb-ha:pg16@sha256:633aa83c3aabab7ca16745bc2506199a4f8de2faa87006d13f60b82911b512c6
        env:
          POSTGRES_USER: fabpilot
          POSTGRES_PASSWORD: ci-only-password # throwaway DB on a throwaway VM, not a secret
          POSTGRES_DB: fabpilot
        ports:
          - 5432:5432
        # Job steps wait until this passes, so tests never race a starting database.
        options: >-
          --health-cmd "pg_isready -U fabpilot -d fabpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Must match the `db` service above: port from `ports:`, password from POSTGRES_PASSWORD.
      DATABASE_URL: postgresql+psycopg://fabpilot:ci-only-password@127.0.0.1:5432/fabpilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.6"
      - run: uv sync --locked --all-packages

      # Each package runs its own suite (own pytest config + conftest). No -m filter: CI has a
      # real Postgres, so integration tests run too.
      - name: pytest (api)
        working-directory: api
        run: uv run pytest -v
      - name: pytest (simulator)
        working-directory: simulator
        run: uv run pytest -v
