# Prebuilt images on GHCR (10.6′b): ghcr.io/<owner>/fabpilot-python and fabpilot-web, for
# amd64 + arm64, so self-hosters can `docker compose pull` instead of building (README).
# Built and pushed by CI only, never from a laptop: every image traces back to a commit and a run.
name: images

on:
  push:
    branches: [main]
    # Only what changes an image's CONTENT (the .dockerignore allowlist + the Dockerfiles).
    paths:
      - ".github/workflows/images.yml"
      - ".dockerignore"
      - "infra/docker/**"
      - "pyproject.toml"
      - "uv.lock"
      - "api/**"
      - "simulator/**"
      - "mcp/**"
      - "data/**"
      - "web/**"
    tags: ["v*"]
  workflow_dispatch:
# NOT on pull_request: a PR must never push images (and a fork's PR has no write token anyway).
# Building on PRs is the job of the chart test (10.5′).

# The newest push to main wins; a superseded run is cancelled.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions: {} # nothing by default; the job asks for exactly what it needs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push to ghcr.io with the run's own GITHUB_TOKEN (no PAT, nothing long-lived)
    strategy:
      fail-fast: false # one image failing must not cancel the other
      matrix:
        include:
          - image: python
            dockerfile: infra/docker/python.Dockerfile
          - image: web
            dockerfile: infra/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR names must be lowercase; the owner is "gmMustafa".
      - name: image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fabpilot-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      # The tags this run pushes, plus OCI labels (org.opencontainers.image.source links the
      # package to this repo on GitHub).
      - name: tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          # sha-<short commit>: IMMUTABLE, "exactly this code" (bug reports, deployments).
          # latest: a MOVING pointer for self-hosters, from the default branch only.
          # 1.2.3 / 1.2: from a v1.2.3 git tag (semver rules fire on tag pushes only).
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # latest=false: the default `auto` ADDS latest to every semver tag build (README), so a
          # tag on an older commit (a hotfix) would move latest backwards. Only the rule above.
          flavor: |
            latest=false

      # QEMU: arm64 build steps run emulated on the amd64 runner (slow for RUN steps; measure,
      # then decide: native ubuntu-24.04-arm runners are the faster, more complex alternative).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # A docker-container builder: the classic driver can't build multi-platform (10.1b).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in GitHub's Actions cache, one scope per image: a code change rebuilds
          # only the code layers (10.1b), like on the laptop.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
