    relevant: ["MAN-CNC-001 §5.1", "SOP-CNC-002", "INC-2025-006", "INC-2023-004"]

  - id: Q08
    question: "Parts from the molder come out incomplete with unmelted pellets in them, but the machine shows no alarm"
    category: symptom
    machine_type: injection_molder
    relevant: ["MAN-IMM-001 §5.3", "INC-2025-002"]

  - id: Q09
    question: "The air compressor is running loaded nonstop and the plant air pressure still keeps sagging"
    category: symptom
    machine_type: compressor
    relevant: ["MAN-CMP-001 §5.3", "INC-2026-006"]

  - id: Q10
    question: "Mill spindle bogs down and the current spikes, always at the same spot in the program"
    category: symptom
    machine_type: cnc_mill
    relevant: ["MAN-CNC-001 §5.4", "INC-2024-017"]

  # ---------- procedure (4) ----------
  - id: Q11
    question: "How do I safely replace the compressor's intake filter?"
    category: procedure
    machine_type: compressor
    relevant: ["SOP-CMP-005", "MAN-CMP-001 §1"]

  - id: Q12
