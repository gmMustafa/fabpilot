    question: "M-06 keeps creeping up into an oil temperature alarm, yet it runs exactly like its twin next to it. What's going on?"
    category: false_alarm
    machine_type: injection_molder
    relevant: ["INC-2024-016", "SOP-GEN-004", "MAN-IMM-001 §5.4", "MAN-IMM-001 §6"]

  - id: Q17
    # v2 (3.4 review): v1 copied the decisive evidence almost verbatim from INC-2026-007.
