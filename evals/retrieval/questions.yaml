    relevant: ["SOP-PMP-009"]

  - id: Q14
    question: "The conveyor drive tripped on overload. Can I just reset it and carry on?"
    category: procedure
    machine_type: conveyor
    relevant: ["SOP-GEN-007", "MAN-CNV-001 §5.2"]

  # ---------- false_alarm (3) ----------
  - id: Q15
    question: "M-01 spindle temperature alarm, but the reading kept going up over the weekend while nobody was running the machine"
