# Gold questions for the retrieval eval (3.4). Run: cd api; uv run python ../evals/retrieval/run.py
#
# RULES (they protect the measurement):
# 1. Write the QUESTION first, the way a technician or the agent would ask it, and only THEN look up
#    the answer. Copying the document's wording measures copying, not search.
# 2. `relevant`: every section that answers it. "MAN-PMP-001 §5" also accepts §5.1, §5.2 ...;
#    "MAN-PMP-001" accepts any section. Be honest: if two sections answer it, list both.
# 3. `machine_type` only if the asker would know it (an alarm on M-09 -> pump). Omit otherwise.
# 4. Target mix (20): code 4, symptom 6, procedure 4, false_alarm 3, cross_machine 3.
#
# category: code | symptom | procedure | false_alarm | cross_machine

questions:
  - id: Q01
    question: "What does a PRESS-LOW alarm on the inlet_filter_dp of the compressor mean?"
    category: code
    machine_type: compressor
    relevant: ["MAN-CMP-001 §4"]

  - id: Q02
    question: "The conveyor keeps jerking, the roller speed goes up and down every couple of minutes"
    category: symptom
    machine_type: conveyor
    relevant: ["MAN-CNV-001 §5.1", "SOP-CNV-008"]

  - id: Q03
    question: "M-09 is showing PRESS-LOW on suction_strainer_dp, what does that mean?"
    category: code
    machine_type: pump
    relevant: ["MAN-PMP-001 §4", "SOP-PMP-006 §4"]

  - id: Q04
    question: "M-02 spindle stopped with a TRIP, where do I start looking?"
    category: code
    machine_type: cnc_mill
    relevant: ["MAN-CNC-001 §4", "MAN-CNC-001 §6", "SOP-GEN-007 §4"]

  - id: Q05
    question: "RPM-LOW on the screw of M-05, what should I check?"
    category: code
    machine_type: injection_molder
    relevant: ["MAN-IMM-001 §4", "MAN-IMM-001 §5.1"]

  # ---------- symptom (Q02 + 5) ----------
  - id: Q06
    question: "The coolant pump sounds like it's pumping gravel and the outlet pressure keeps jumping around"
    category: symptom
    machine_type: pump
    relevant: ["MAN-PMP-001 §5.3", "MAN-PMP-001 §5.2", "SOP-PMP-006"]

  - id: Q07
    question: "Spindle vibration on the mill goes up a little every day this week, temperature is still fine"
    category: symptom
