# Ground truth: spindle bearing wear on a CNC mill. Vibration rises over days, temperature only
# at the end (MAN-CNC-001 §5.1). The repair is the spindle unit exchange (SOP-CNC-002).
id: bearing-wear-m01
description: Spindle bearing wearing over the simulator's default duration; vibration first, then temperature.
setup:
  machine: M-01
  fault: bearing_wear
question: "M-01 is showing vibration alarms. What is going on and what should I check?"
expect:
  category: machine_fault
  root_cause_keywords: [[bearing], [wear, worn, degrad, damage]]
  must_cite: [MAN-CNC-001, SOP-CNC-002]
  tools: [get_readings, get_alarm_log]
  work_order: required
