apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fabpilot.fullname" . }}-api
  labels:
    {{- include "fabpilot.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "fabpilot.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start the new pod first, remove the old one only when the new one is READY: no gap.
      # Costs a second pod's memory for a moment (~130 MB at rest).
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "fabpilot.labels" (dict "ctx" . "component" "api") | nindent 8 }}
      annotations:
        # A changed ConfigMap doesn't restart pods by itself; a changed checksum here does.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # The API never talks to the Kubernetes API: no token mounted, nothing to steal.
      automountServiceAccountToken: false
      initContainers:
        {{- include "fabpilot.migrateInit" . | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No command: the image's CMD (uvicorn on 0.0.0.0:8000).
          ports:
            - name: http
              containerPort: 8000
          {{- include "fabpilot.pythonEnv" . | nindent 10 }}
          {{- include "fabpilot.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 8

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            # The only writable place (readOnlyRootFilesystem): Python's tempfile, onnxruntime.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fabpilot.fullname" . }}-api
  labels:
    {{- include "fabpilot.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP # inside the cluster only; the way in from outside is the Ingress (10.4c)
  selector:
    {{- include "fabpilot.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
