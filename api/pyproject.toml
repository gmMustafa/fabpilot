[project]
name = "fabpilot-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.5",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

# ---------------------------------------------------------------- ruff (lint + format)
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear (likely bugs), UP pyupgrade (modern syntax),
# ASYNC (blocking calls inside async code — important for us), SIM simplifications, RUF ruff-specific.
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

# ---------------------------------------------------------------- mypy (types)
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# auto: every `async def test_*` runs on an event loop without needing @pytest.mark.asyncio.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Fail on typos like @pytest.mark.integraton instead of silently ignoring them.
addopts = "--strict-markers"
markers = [
    "integration: needs real services (Postgres via docker compose); deselect with -m 'not integration'",
]
