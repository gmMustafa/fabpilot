# The backend stack (10.2). Values come from .env (compose reads it automatically for ${VAR}
# interpolation, and env_file below passes it into the Python containers).
#
#   docker compose up -d --build                     db -> migrate (exits 0) -> api (healthy)
#   docker compose --profile setup run --rm seed     plant + sensors + knowledge base (idempotent)
#   docker compose --profile sim up -d simulator     live readings every 10 s
#
# The dev path (`uv run ...` against this same db) keeps working: only `db` publishes 5433.
name: fabpilot

# One image for every Python service, built once (infra/docker/python.Dockerfile); only the
# command differs. `x-` keys are ignored by compose itself: they exist to be referenced (&/*).
x-python: &python
  # Local build by default (fabpilot-python:dev). Prebuilt from GHCR (10.6′b), in .env:
  #   IMAGE_REGISTRY=ghcr.io/gmmustafa/  IMAGE_TAG=latest (or sha-<commit>)  PULL_POLICY=always
  image: ${IMAGE_REGISTRY:-}fabpilot-python:${IMAGE_TAG:-dev}
  # Built or pulled by `api` only (below); the others reuse that image, never pull on their own.
  pull_policy: never
  env_file: .env
  environment: &python-env
    # environment: WINS over env_file. .env's DATABASE_URL points at 127.0.0.1:5433 for `uv run`
    # on your machine; in a container that's the container itself. `db` is the service's DNS
    # name on the compose network, 5432 its port INSIDE that network. The password goes into a
    # URL here: characters like @ / : # in POSTGRES_PASSWORD would have to be %-encoded.
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # The model baked into the image; an EMBEDDING_CACHE_DIR in .env (a Windows path) must not win.
    EMBEDDING_CACHE_DIR: /opt/fastembed

services:
  db:
    # Tag for readability, digest for reproducibility: the digest wins, so an upstream re-push of "pg16"
    # can't silently change our database. Multi-arch index (linux/amd64 + linux/arm64), verified with
    # `docker buildx imagetools inspect`. Bump deliberately: re-inspect, update digest, test.
    image: timescale/timescaledb-ha:pg16@sha256:633aa83c3aabab7ca16745bc2506199a4f8de2faa87006d13f60b82911b512c6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bind to localhost only: the DB is reachable from this machine, not from the whole network.
      # Host port defaults to 5433 to avoid clashing with a native Postgres on 5432.
      # Inside the Docker network the DB is still on 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # This image keeps PGDATA at /home/postgres/pgdata/data (NOT /var/lib/postgresql/data).
      - pgdata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Schema changes, ONCE per `up`, then exit 0. Not inside the API's startup: with two API
  # replicas, two processes would migrate at the same time. Kubernetes: a Job / Helm hook (10.4).
  migrate:
    <<: *python
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *python
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    pull_policy: ${PULL_POLICY:-build} # build = from source; always = from IMAGE_REGISTRY
    ports:
      # API_PORT: the host side. Default 8000, the same as `uv run uvicorn`: run one or the other.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
        db:
          condition: service_healthy
        migrate:
          condition: service_completed_successfully
    restart: unless-stopped

  # The dashboard (10.6′a): http://localhost:3000 (localhost, not 127.0.0.1: that is the origin
  # the API's CORS_ORIGINS allows). Two API URLs, because the API is called from two places:
  # the browser uses the one baked in at build time (127.0.0.1:${API_PORT}, the published port),
  # the Next.js server uses api:8000 on the compose network (read at runtime).
  web:
    image: ${IMAGE_REGISTRY:-}fabpilot-web:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:${API_PORT:-8000}
    # A PULLED web image has http://127.0.0.1:8000 baked in (the Dockerfile's default): with
    # another API_PORT or host, build it yourself (PULL_POLICY=build), see 10.6′a.
    pull_policy: ${PULL_POLICY:-build}
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # One-off setup: `docker compose --profile setup run --rm seed`. Both steps are idempotent.
  seed:
    <<: *python
    profiles: [setup]
    command: ["sh", "-c", "python -m app.seed && python -m app.rag.ingest"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Live sensor readings every 10 s: `docker compose --profile sim up -d simulator`.
  simulator:
    <<: *python
    profiles: [sim]
    command: ["simulator", "run"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
